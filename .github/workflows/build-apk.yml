name: Build MoneyTrack APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode MoneyTrack
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.moneytrack.app",
            "appName": "MoneyTrack",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
